name: Publish NuGet

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3-beta.1 (got ${TAG})"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing RebelQuery ${VERSION}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pack
        run: >
          dotnet pack Rquery/RebelQuery.csproj
          --configuration Release
          --output "${{ github.workspace }}/nupkgs"
          -p:Version=${{ steps.version.outputs.version }}
          -p:PackageVersion=${{ steps.version.outputs.version }}
          -p:GeneratePackageOnBuild=false

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org profile name (not email). Change if it differs from GitHub.
          user: rafaelrabelos

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push "${{ github.workspace }}/nupkgs/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: RebelQuery ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: nupkgs/*.nupkg
